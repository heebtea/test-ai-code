name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [work]

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium
      - name: Browser regression and layout tests
        run: npm run test:browser
      - name: Upload synthetic screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v03-layout-screenshots
          path: test-results/
      - name: Audit production dependencies
        run: npm audit --omit=dev
