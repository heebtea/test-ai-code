name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [work, main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium
      - name: Browser regression and layout tests
        run: npm run test:browser
      - name: Install WebKit
        run: npx playwright-core install --with-deps webkit
      - name: WebKit backup, statistics, AI snapshot and journal
        env:
          BROWSER_ENGINE: webkit
          SCREENSHOT_DIR: test-results/webkit
        run: |
          node tests/v05-browser.cjs
          node tests/stats-v2-browser.cjs
          node tests/ai-bridge-browser.cjs
          node tests/journal-flow-browser.cjs
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results/
      - name: Audit production dependencies
        run: npm audit --omit=dev
